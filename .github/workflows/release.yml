name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: depreciated

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsqlcipher-dev libncurses-dev gcc g++ libreadline-dev

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/hermes_server-linux-x86_64.tar.gz -C bin/server hermes_server
          tar -czf dist/hermes_client-linux-x86_64.tar.gz -C bin/client hermes_client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-linux-x86_64
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
